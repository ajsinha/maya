{% extends "base.html" %}
{% block title %}{{ error.__class__.__name__ }}{% endblock %}
{% block content %}
<h1>{{ error.__class__.__name__ }}</h1>
<div class="alert alert-danger" role="alert">{{ error.message }}</div>
{% if error.context %}<details><summary class="small-muted">Details</summary><pre>{{ error.context|tojson_pretty }}</pre></details>{% endif %}
<p><a href="/" class="btn btn-sm btn-outline-secondary">Home</a></p>
{% endblock %}
