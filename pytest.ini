[pytest]
testpaths = tests
markers =
    scale: runs at a size where the platform's performance claims are
        falsifiable. Excluded from the default run because a suite that is
        slow gets disabled, and a disabled suite proves nothing. Run with
        `-m scale`, or everything with `-m "scale or not scale"`.
# `-n auto --dist loadfile` runs the suite across every core, one FILE per
# worker. By file rather than by test because the expensive fixtures here are
# module-scoped and several suites seed a shared estate; splitting inside a file
# would rebuild that per worker and race on it.
#
# The measurement that put it here: 2,965 tests went from over ten minutes
# serially to under two. A suite slow enough to skip during a change is a suite
# that stops catching things, which is the same failure as not having it.
# `-p no:randomly` is deliberately NOT set — order randomisation catches the
# inter-test coupling this parallelism would otherwise hide.
addopts = -m "not scale" -n auto --dist loadfile
