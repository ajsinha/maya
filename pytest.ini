[pytest]
testpaths = tests
markers =
    scale: runs at a size where the platform's performance claims are
        falsifiable. Excluded from the default run because a suite that is
        slow gets disabled, and a disabled suite proves nothing. Run with
        `-m scale`, or everything with `-m "scale or not scale"`.
addopts = -m "not scale"
