# ==========================================================================
# ${VAR} and ${VAR:default} substitution resolves against other keys in this
# file, environment variables, and command-line --key=value overrides.
# Values are read as strings and coerced on access (get_int / get_bool /
# get_list), so `port: 5006` and `port: "${PORT:5006}"` behave identically.
#
# Secrets do NOT belong here: this file is tracked. Put them in
# config/application.local.yaml, a git-ignored overlay loaded straight after
# this file, which sets only the keys it names.
# ==========================================================================

app:
  name: MAYA
  tagline: Model & AI Lifecycle Assurance
  slogan: Evidence, not assertion.
  version: "0.1.0"
  author:
    name: Ashutosh Sinha
    email: ajsinha@gmail.com
  copyright:
    years: "2026"
    holder: Ashutosh Sinha
  trademark:
    notice: "MAYA(TM) is a trademark of Ashutosh Sinha"

server:
  host: "0.0.0.0"
  port: "${PORT:5006}"
  reload: false

auth:
  # Development default. Override in config/application.local.yaml (git-ignored)
  # or via MAYA_AUTH_PASSWORD before exposing this beyond a workstation.
  username: admin
  password: "${MAYA_AUTH_PASSWORD:admin123}"
  # PBKDF2-HMAC-SHA256 rounds. Deliberately expensive for an interactive login.
  # A successful verification is then trusted for verification_ttl_seconds so an
  # API caller does not pay the cost on every request; suspension and status are
  # still re-read every time.
  kdf_iterations: 200000
  verification_ttl_seconds: 60
  # Session cookie signing secret. A committed value is a public value, and a
  # public value lets anyone forge a session — so override it in the local
  # overlay for any deployment that matters.
  session_secret: "${MAYA_SESSION_SECRET:maya-development-secret-change-me}"
  session_max_age: 28800


  # Single sign-on lives UNDER this key rather than opening a second
  # top-level `auth:`. It used to open one, and YAML keeps only the last
  # mapping for a duplicated key -- so the bootstrap password and the
  # session-signing secret above were silently discarded, and the comments
  # telling a deployer to set MAYA_AUTH_PASSWORD and MAYA_SESSION_SECRET
  # described settings that had no effect at all.
  # Single sign-on. Empty issuer means local credentials only, which is the
  # default: an instance that silently required a directory to be reachable
  # would lock everybody out of the register the first time it was not.
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    redirect_uri: "http://localhost:5006/auth/callback"
    scopes: "openid, profile, email"
    group_claim: groups
    username_claim: preferred_username
    # Create a principal on first login? Off by default. Auto-provisioning gives
    # everybody in the directory a foothold in the model register, and that is a
    # decision somebody should make deliberately rather than inherit.
    provision: false
    # Group -> roles. The group name is the key because that is what the
    # directory controls; the roles are the value because that is what MAYA
    # controls, and the direction of that arrow is the point. A group with no
    # entry grants nothing; it does not grant itself.
    roles:
      # maya-developers: model_developer
      # maya-validators: validator
      # maya-risk: model_risk_manager

database:
  # There are no migrations. The schema is db/schema/sqlite.sql and
  # db/schema/postgres.sql, applied idempotently at start-up; the dialect is
  # chosen from this URL alone and nothing else in the application changes.
  #
  #   SQLite     (default)  sqlite:///${data.sqlite.dir}/maya.db
  #   PostgreSQL            postgresql+psycopg://maya:secret@localhost/maya
  #
  # Only column types with the same meaning in both dialects are used, so the
  # two schemas differ in exactly two substitutions. See db/schema/.
  url: "sqlite:///${data.sqlite.dir}/maya.db"
  echo: false

data:
  # Nothing under data/ is committed. It is runtime state: the control-plane
  # database, the artifact store, and the Delta Lake root.
  dir: ./data
  attachments: "${data.dir}/attachments"
  artifacts: "${data.dir}/artifacts"

  # SQLite lives here by default. Switch database.url to PostgreSQL and this
  # directory is simply unused.
  sqlite:
    dir: "${data.dir}/sqlite"

  # Delta Lake root. Feature values, dataset snapshots, inference logs and
  # monitoring observations live here — everything whose volume scales with
  # business events rather than with the number of models (see docs/05, rule R2).
  delta:
    dir: "${data.dir}/delta"
    features: "${data.delta.dir}/features"
    snapshots: "${data.delta.dir}/snapshots"
    telemetry: "${data.delta.dir}/telemetry"
    monitoring: "${data.delta.dir}/monitoring"
    # Minimum time-travel retention. Regulatory feature views are aligned to the
    # audit cycle; over-retaining costs less than failing an examination.
    retention_days: 400

# ---------------------------------------------------------------- governance
risk:
  # Exposure bands, in the reporting currency. Materiality is a JOIN of a
  # quantitative band with a qualitative purpose class; complexity is a MEET
  # over its components. Tier is a monotone map of the two (law L-4).
  exposure_bands:
    negligible: 0
    low: 1000000
    moderate: 50000000
    material: 500000000
    critical: 5000000000
  purpose_ranks:
    commercial: 1
    risk_management: 2
    financial_reporting: 3
    regulatory_capital: 4
  review_months:
    1: 12
    2: 18
    3: 24
    4: 36

warrants:
  # Tier 1 defaults are deliberately short, and grace is zero: grace extends
  # authorisation currency, never revocation ignorance (adversarial finding C-1).
  ttl_seconds:
    1: 60
    2: 300
    3: 3600
    4: 3600
  grace_seconds:
    1: 0
    2: 0
    3: 900
    4: 900
  jitter_pct: 20
  signing_key_id: maya-dev-key

# MAYA manages models and issues warrants. It does not execute models. A captive
# engine is bundled as a reference CONSUMER of the public warrant API, so that a
# deployment works out of the box; disable it and any external engine that
# resolves warrants behaves identically.
execution:
  captive:
    enabled: true
    max_seconds: 30
    # Artifacts are read from data.artifacts and their digest is verified against
    # the warrant before anything is loaded. The engine implements three of the
    # grammar's eighteen runtimes -- registered callables, ONNX, the
    # regression and scorecard subset of PMML -- and refuses the rest by name.
    #
    # Artifact-backed runtimes run in a child process with CPU and memory limits
    # taken from the warrant's constraints.resources. That protects against a
    # runaway or crashing artifact; it does NOT protect against a hostile one,
    # which needs a container or a VM. Bound callables cannot be isolated at all.
    sandbox: subprocess          # or "none", deliberately and visibly

notifications:
  # Nothing reaches out by default over anything but the log. An instance that
  # quietly needed an SMTP relay to function would fail in a way nobody could
  # diagnose from the outside.
  channel: log                 # log | webhook | email
  # An unchanged worklist stays quiet for this long. Nothing is more certain to
  # be ignored than a daily message that says exactly what yesterday's said.
  quiet_hours: 24
  # An item overdue and unactioned for this long stops being only its owner's
  # problem and is escalated to the second line -- by role, because MAYA does
  # not know who reports to whom and should not pretend to.
  escalate_after_days: 7
  base_url: "http://localhost:5006"
  webhook:
    url: ""
  email:
    host: ""
    port: 25
    sender: "maya@localhost"
    username: ""
    password: ""
    use_tls: false

lifecycle:
  # A version approval is a quorum where the tier says it should be. The model
  # record was already attested by several people; the version is what actually
  # runs, so if anything deserves more than one signature it is this. Tiers
  # absent from this map are approved by one authorised person.
  version_approval:
    quorum:
      1: [model_risk_manager, validator]
      2: [model_risk_manager, validator]

  attestation:
    # Who must sign before a model record is in force. Attestation is a quorum,
    # not a signature: every role named here signs, and one decline ends it.
    # This is a policy question, so it is configuration.
    required_roles: [model_owner, model_risk_manager]
    validity_days: 365

findings:
  # The workflow between raising a finding and closing it. All three are policy
  # questions and none of them is a threshold the platform should decide.
  #
  # How many times a remediation date may be moved before the extension itself
  # becomes a finding. The same answer, for the same reason, as the overlay
  # register's renewal limit: a date moved often enough is not a date.
  extension_limit: 2
  # How long an owner has to accept a finding as theirs. Past this the silence
  # is the problem, because an unaccepted finding looks exactly like one
  # somebody is working on.
  acknowledge_days: 5
  # And how long past its date a finding stops being only its owner's problem.
  # Deliberately the same default as notifications.escalate_after_days.
  escalate_after_days: 7

overlays:
  # How long a single overlay period may run before it must be re-examined, and
  # how many renewals before the register treats the adjustment as an
  # unversioned model change and raises a finding. Both are policy questions.
  max_days: 180
  renewal_limit: 2

regimes:
  # Supervisory regimes to activate at startup. Each is an institution: its own
  # vocabulary, its own obligations, and a translation into the platform's core
  # terms. A regime is refused activation unless its translation passes the
  # satisfaction condition, because an encoding whose truth does not survive
  # translation produces determinations nobody can defend.
  active: [sr-26-2, ss1-23, eu-ai-act]

scheduler:
  # Turning a computed condition into a recorded consequence: a lapsed
  # attestation, a monitor that has stopped running, an overlay past its window,
  # baseline debt whose evidence arrived.
  #
  # Every job is idempotent and derives its own work from the register, so this
  # loop is a convenience only. Cron calling POST /api/v1/scheduler/run produces
  # identical results, and is the right answer for more than one replica.
  loop:
    enabled: false
    interval_seconds: 3600

content:
  # Help and about pages are markdown files rendered at request time. They live
  # in the repository rather than the database so that a change to what the
  # platform says about itself is reviewable in the same pull request as the
  # change to what it does.
  dir: ./content

logging:
  level: INFO
  format: "%(asctime)s %(levelname)-7s %(name)s | %(message)s"

# Machine assistance. Which model MAYA may ask for a draft.
#
# `mock` is the default and is not a placeholder for testing -- it exercises the
# entire governed path (capability gating, oracles, the grounding gate,
# attestation, automation-bias sampling) without calling anything, because none
# of that ever depended on the sentence being real.
#
# Every other provider refuses by name until the deployment has answered four
# questions that are not code: whether this instance may reach the internet at
# all, what of the register may leave the institution, how a non-deterministic
# model's output is made reproducible, and who pays. See core/assist/providers.
assist:
  provider: mock
