# ==========================================================================
# MAYA — Model & AI Lifecycle Assurance · configuration
# ==========================================================================
# Loaded by maya/core/properties_configurator.py (adopted from DishtaYantra).
#
# Precedence, lowest to highest:
#   this file -> config/application.local.yaml (git-ignored overlay)
#             -> environment variables (the full dotted key, e.g. db.dialect)
#             -> command-line flags   (python run_maya_web.py --db.dialect=postgresql)
#
# ${VAR} and ${VAR:default} resolve against other keys, the environment and
# --key=value flags. Values are strings, coerced on access.
#
# THIS FILE IS TRACKED AND CARRIES NO SECRET. A test enforces it. Put secrets
# in config/application.local.yaml or the environment.
# ==========================================================================

app:
  name: MAYA
  # dev | uat | prod. Outside dev: the default admin password refuses to start,
  # SQLite refuses to start in prod, and the sandbox minimum tier is enforced.
  environment: "${MAYA_ENV:dev}"
  # Session-signing secret. Deliberately empty here. In dev, when unset, MAYA
  # generates one under storage.root/keys/ (never in this file). Outside dev an
  # unset secret refuses to start.
  secret_key: "${MAYA_SECRET_KEY:}"
  allow_default_admin_password: "false"

server:
  host: "${MAYA_HOST:127.0.0.1}"
  port: "${MAYA_PORT:8600}"
  # Web processes. 1 serves everything from one process. Above 1 (PostgreSQL only:
  # SQLite admits one writing process, and MAYA refuses the combination), this many
  # web processes serve the port — on Linux each on its own SO_REUSEPORT socket, so
  # connections spread evenly — and the launching process keeps the job workers,
  # webhooks and scheduler. One Python process serves roughly 40 page requests a
  # second; size this to cores and load. Prometheus metrics are per process.
  workers: "${MAYA_WEB_WORKERS:1}"

logging:
  level: INFO
  format: text            # text | json
  file: "${storage.root}/logs/maya.log"

# --------------------------------------------------------------------------
# Database. Switch dialect here; nothing else changes.
#   sqlite      -> schema from maya/persistence/schema/sqlite.sql
#   postgresql  -> schema from maya/persistence/schema/postgresql.sql
# There is no migration framework (spec §14.3). On a schema-hash mismatch MAYA
# refuses to start and names the export -> init-db -> import commands.
# --------------------------------------------------------------------------
db:
  dialect: "${MAYA_DB_DIALECT:sqlite}"
  echo: "false"
  sqlite:
    path: "${storage.root}/maya.db"
    busy_timeout_ms: 30000
  postgresql:
    host: "${MAYA_PG_HOST:localhost}"
    port: "${MAYA_PG_PORT:5432}"
    database: "${MAYA_PG_DATABASE:maya}"
    user: "${MAYA_PG_USER:maya}"
    # The password comes from the environment or the local overlay, never here.
    password: "${MAYA_PG_PASSWORD:}"
    pool_size: 10
    max_overflow: 10

storage:
  # Root of the local stores: blobs, the Delta lake, keys, logs, the SQLite file.
  root: "${MAYA_HOME:data}"

lake:
  # auto | native | pure  (maya_delta, spec §7.4)
  backend: auto
  # Compaction and vacuum of every lake table, daily by the scheduler or on demand.
  maintenance:
    interval_seconds: 86400
    target_size_mb: 128
    # Unreferenced files are kept this long for time travel; under 168 is allowed but explicit.
    vacuum_retention_hours: 168
  fragment:
    target_rows: 512
    min_rows: 32
    max_rows: 8192

auth:
  # db | sso | hybrid
  mode: db
  session:
    idle_timeout_minutes: 30
    absolute_timeout_hours: 12
    # A signed-in session's principal is reused this many seconds (0: never), because
    # one page makes several internal calls. A sign-out or access change in another
    # web process reaches a session at most this late; in the same process, at once.
    principal_cache_seconds: 2
  password:
    min_length: 12
  lockout:
    attempts: 5
    window_minutes: 15
    duration_minutes: 30
  api_keys:
    max_days: 365
  # mode: sso or hybrid needs these. protocol: oidc (authorization code flow with
  # PKCE) or saml2 (SP-initiated Web SSO; needs python3-saml and xmlsec).
  sso:
    protocol: "${MAYA_SSO_PROTOCOL:oidc}"
    issuer: "${MAYA_OIDC_ISSUER:}"
    client_id: "${MAYA_OIDC_CLIENT_ID:maya}"
    client_secret: "${MAYA_OIDC_CLIENT_SECRET:}"
    redirect_uri: "${MAYA_OIDC_REDIRECT_URI:http://127.0.0.1:8600/auth/sso/callback}"
    # Set it (and register it with the IdP) to sign out at the IdP too when signing out
    # of MAYA (RP-initiated logout). Empty: signing out ends the MAYA session only.
    # The IdP's back-channel logout URL for MAYA is POST /api/v1/auth/sso/oidc/backchannel-logout.
    post_logout_redirect_uri: "${MAYA_OIDC_POST_LOGOUT_URI:}"
    # Keycloak refuses a scope it does not know: give it a "groups" client scope, or
    # drop "groups" here and put the groups mapper on the client (security guide).
    scopes: "openid profile email groups"
    username_claim: preferred_username
    email_claim: email
    groups_claim: groups
    jit_provision: "true"
    # deny: a person none of whose IdP groups maps to a role cannot sign in
    on_missing_group: deny
    # IdP group -> MAYA roles, re-applied at every login
    group_role_map:
      maya-admins: [admin]
    # SAML 2.0 (protocol: saml2). MAYA's metadata: GET /api/v1/auth/sso/saml/metadata.
    # The IdP must sign assertions; its certificate is public, not a secret.
    saml:
      sp_entity_id: "${MAYA_SAML_SP_ENTITY_ID:}"
      acs_url: "${MAYA_SAML_ACS_URL:http://127.0.0.1:8600/auth/sso/saml/acs}"
      idp_entity_id: "${MAYA_SAML_IDP_ENTITY_ID:}"
      idp_sso_url: "${MAYA_SAML_IDP_SSO_URL:}"
      idp_cert: "${MAYA_SAML_IDP_CERT:}"
      idp_cert_file: "${MAYA_SAML_IDP_CERT_FILE:}"
      # Single logout (optional): the IdP's SLO endpoint. When set, signing out of
      # MAYA also signs out at the IdP, and the IdP's signed LogoutRequests end MAYA
      # sessions at sls_url (front channel only). Tested against Keycloak 26.4 only.
      idp_slo_url: "${MAYA_SAML_IDP_SLO_URL:}"
      sls_url: "${MAYA_SAML_SLS_URL:http://127.0.0.1:8600/auth/sso/saml/sls}"
      # Sign AuthnRequests and logout messages (RSA-SHA256) with MAYA's own key pair.
      # The key comes from the environment or a file, never from this file.
      sign_requests: "${MAYA_SAML_SIGN_REQUESTS:false}"
      sp_cert: "${MAYA_SAML_SP_CERT:}"
      sp_cert_file: "${MAYA_SAML_SP_CERT_FILE:}"
      sp_key: "${MAYA_SAML_SP_KEY:}"
      sp_key_file: "${MAYA_SAML_SP_KEY_FILE:}"
      # empty: the NameID is the username
      username_attribute: ""
      groups_attribute: groups
      email_attribute: email
      name_attribute: displayName
  # Security keys and passkeys (WebAuthn) as a second factor, alongside TOTP.
  # rp_id is the site's domain (not an IP address); origins are the exact
  # scheme://host:port the browser shows, comma-separated.
  webauthn:
    rp_id: "${MAYA_WEBAUTHN_RP_ID:localhost}"
    rp_name: MAYA
    origins: "${MAYA_WEBAUTHN_ORIGINS:http://localhost:8600}"
  mfa:
    # TOTP or a security key for password logins. auto = enforce the role requirement outside dev
    # (in dev only users who enrolled are challenged); true; false.
    enforce: "${MAYA_MFA_ENFORCE:auto}"
    required_for_roles: [admin, model_owner]
    issuer_name: MAYA

sandbox:
  # strong | moderate | minimal. Outside dev, MAYA refuses to start below this.
  min_tier: strong

workflow:
  # Only honoured when app.environment is dev (spec §3).
  allow_self_approval: "false"

typeset:
  # When true, a model cannot be approved on a draft (non-Tectonic) render.
  # The spec's rule; relaxed in dev only if you set it to false explicitly.
  require_true_build: "${MAYA_REQUIRE_TECTONIC:false}"
  # What one build may spend (§17.1). A build also runs with no network: `--only-cached`
  # and a fixed environment always, plus a network namespace where bubblewrap is
  # available. Tectonic's support bundle must therefore be warmed once per host
  # (`tectonic -X bundle fetch`); until it is, builds degrade to the watermarked draft
  # renderer, which is refused wherever a PDF is evidence.
  timeout_seconds: 120
  memory_mb: 2048
  output_mb: 64

jobs:
  # Worker threads inside this process. A separate worker-only process — no port bound,
  # the same queue, the same handlers — is `python run_maya_web.py --worker`, which is
  # what §15.1 and §24.1 mean by a worker fleet; run as many as the database will carry
  # (PostgreSQL: on SQLite a worker contends with the web process for the single writer).
  workers: 2
  max_attempts: 3
  # Fair queueing (§15.2). A worker ranks the oldest queued jobs and takes the one whose
  # owner is least far into their own queue, so one person's 10,000 pins interleave with
  # everyone else's instead of running first. false: strict arrival order.
  fair: "true"
  claim_candidates: 200
  per_user:
    # Jobs one owner may have running at once across the fleet (0: no cap), and waiting
    # (a further submission is refused with an estimated wait).
    max_concurrent: 4
    max_queued: 200
  queue:
    # Backpressure (§15.4): queued jobs across everyone before MAYA refuses new work
    # rather than accepting what it cannot start. 0: no cap.
    max_depth: 2000
    # Assumed service time per job; used only for the wait estimate in that refusal.
    seconds_per_job: 10

featuresets:
  # How long a cascade pin waits for its member pins before giving up.
  cascade_wait_seconds: 120

integrity:
  # §20, §21.3: integrity verification on a schedule, not only on demand. The scheduler
  # submits one `integrity.verify` job per interval, deduplicated by idempotency key so
  # several nodes cannot queue the same sweep twice. 0: on demand only.
  verify:
    interval_seconds: 86400

observability:
  # The SLO and alert rules of §20 ship beside this file, in
  # config/prometheus/maya-slo.rules.yml: load it from your Prometheus `rule_files`.
  # OpenTelemetry span export over OTLP/HTTP, e.g. http://collector:4318/v1/traces.
  # Unset: trace ids still propagate to responses, logs, audit and jobs.
  otlp:
    endpoint: "${MAYA_OTLP_ENDPOINT:}"
  metrics:
    # Name an environment variable holding a bearer token to protect /metrics.
    token_env: ""
    # Pins and bytes stored per namespace, counted at scrape time. Off on an estate
    # large enough that counting pin rows on every scrape costs more than the answer.
    namespace_gauges: "true"
    # The costly gauges — lake file counts, pins per namespace — are held this long
    # rather than recomputed on every scrape.
    cache_seconds: 60
  # A database statement slower than this counts as a slow query in /metrics.
  slow_query_ms: 500
  webhooks:
    max_attempts: 8
    timeout_seconds: 5
    # dev only: allow http://localhost and private addresses (never outside dev)
    allow_private: "false"

health:
  # The health page re-walks the whole audit chain at most this often; the audit page
  # and the integrity check always walk it afresh.
  audit_verify_seconds: 60

sources:
  # §5.2 'python' sources: a producer function run in the sandbox on each pull.
  python:
    cpu_seconds: 30
    memory_mb: 1024
    wall_seconds: 60
    max_output_mb: 20

assistant:
  # §29.8 the recorded challenger: a memo on every submission into review. It never
  # approves, blocks or edits; the reviewer records whether they agreed.
  enabled: "true"
  # rules: deterministic findings only, no network.
  # claude: also asks Claude, sending definitions, the specification and the formula
  #         (never data rows) to Anthropic's API. Opt-in.
  provider: "${MAYA_ASSISTANT_PROVIDER:rules}"
  claude:
    model: "claude-opus-5"
    effort: "high"
    # empty: the Anthropic SDK's own credential resolution (ANTHROPIC_API_KEY, ant auth login)
    api_key_env: ""
    timeout_seconds: 300

custody:
  # §29.6: pin the audit chain head outside the database, periodically.
  # signature (Ed25519), file (append-only JSON lines), event (a webhook-visible
  # audit.anchored event), rfc3161 (a timestamp authority; sends the head hash out).
  anchor:
    methods: "signature,file,event"
    # Put this on WORM or off-host storage; empty means <storage.root>/anchors.jsonl
    file: "${MAYA_ANCHOR_FILE:}"
    tsa_url: "${MAYA_TSA_URL:}"
    # The TSA's CA certificate (PEM). Set, MAYA checks the TSA's signature on every
    # token with `openssl ts -verify`; empty, it checks the status and imprint only.
    tsa_ca_file: "${MAYA_TSA_CA_FILE:}"
    interval_seconds: 3600

workspaces:
  shadow:
    # rows replayed per dependent warrant (the most recent, by index); stated on the report
    sample_rows: 5000
    # an absolute output shift above this counts as material, unless the model declares its
    # own figure or its namespace sets one
    materiality: 0.0001
    # what a replay may cost a namespace in a rolling day, in row comparisons; a namespace
    # may set its own (shadow_budget_rows), and 0 anywhere means no ceiling
    budget_rows: 2000000

# Dependency seams (spec §13.4). auto, or pin a backend to force it.
seams:
  json: auto
  frames: auto
  compress: auto
  kdf: auto
