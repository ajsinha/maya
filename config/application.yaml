# ==========================================================================
# ${VAR} and ${VAR:default} substitution resolves against other keys in this
# file, environment variables, and command-line --key=value overrides.
# Values are read as strings and coerced on access (get_int / get_bool /
# get_list), so `port: 5006` and `port: "${PORT:5006}"` behave identically.
#
# Secrets do NOT belong here: this file is tracked. Put them in
# config/application.local.yaml, a git-ignored overlay loaded straight after
# this file, which sets only the keys it names.
# ==========================================================================

app:
  name: MAYA
  tagline: Model & AI Lifecycle Assurance
  slogan: Evidence, not assertion.
  version: "0.1.0"
  author:
    name: Ashutosh Sinha
    email: ajsinha@gmail.com
  copyright:
    years: "2026"
    holder: Ashutosh Sinha
  trademark:
    notice: "MAYA(TM) is a trademark of Ashutosh Sinha"

server:
  host: "0.0.0.0"
  port: "${PORT:5006}"
  reload: false

auth:
  # Development default. Override in config/application.local.yaml (git-ignored)
  # or via MAYA_AUTH_PASSWORD before exposing this beyond a workstation.
  username: admin
  password: "${MAYA_AUTH_PASSWORD:admin123}"
  # PBKDF2-HMAC-SHA256 rounds. Deliberately expensive for an interactive login.
  # A successful verification is then trusted for verification_ttl_seconds so an
  # API caller does not pay the cost on every request; suspension and status are
  # still re-read every time.
  kdf_iterations: 200000
  verification_ttl_seconds: 60
  # Session cookie signing secret. A committed value is a public value, and a
  # public value lets anyone forge a session — so override it in the local
  # overlay for any deployment that matters.
  session_secret: "${MAYA_SESSION_SECRET:maya-development-secret-change-me}"
  session_max_age: 28800

database:
  # There are no migrations. The schema is db/schema/sqlite.sql and
  # db/schema/postgres.sql, applied idempotently at start-up; the dialect is
  # chosen from this URL alone and nothing else in the application changes.
  #
  #   SQLite     (default)  sqlite:///${data.sqlite.dir}/maya.db
  #   PostgreSQL            postgresql+psycopg://maya:secret@localhost/maya
  #
  # Only column types with the same meaning in both dialects are used, so the
  # two schemas differ in exactly two substitutions. See db/schema/.
  url: "sqlite:///${data.sqlite.dir}/maya.db"
  echo: false

data:
  # Nothing under data/ is committed. It is runtime state: the control-plane
  # database, the artifact store, and the Delta Lake root.
  dir: ./data
  artifacts: "${data.dir}/artifacts"

  # SQLite lives here by default. Switch database.url to PostgreSQL and this
  # directory is simply unused.
  sqlite:
    dir: "${data.dir}/sqlite"

  # Delta Lake root. Feature values, dataset snapshots, inference logs and
  # monitoring observations live here — everything whose volume scales with
  # business events rather than with the number of models (see docs/05, rule R2).
  delta:
    dir: "${data.dir}/delta"
    features: "${data.delta.dir}/features"
    snapshots: "${data.delta.dir}/snapshots"
    telemetry: "${data.delta.dir}/telemetry"
    monitoring: "${data.delta.dir}/monitoring"
    # Minimum time-travel retention. Regulatory feature views are aligned to the
    # audit cycle; over-retaining costs less than failing an examination.
    retention_days: 400

# ---------------------------------------------------------------- governance
risk:
  # Exposure bands, in the reporting currency. Materiality is a JOIN of a
  # quantitative band with a qualitative purpose class; complexity is a MEET
  # over its components. Tier is a monotone map of the two (law L-4).
  exposure_bands:
    negligible: 0
    low: 1000000
    moderate: 50000000
    material: 500000000
    critical: 5000000000
  purpose_ranks:
    commercial: 1
    risk_management: 2
    financial_reporting: 3
    regulatory_capital: 4
  review_months:
    1: 12
    2: 18
    3: 24
    4: 36

warrants:
  # Tier 1 defaults are deliberately short, and grace is zero: grace extends
  # authorisation currency, never revocation ignorance (adversarial finding C-1).
  ttl_seconds:
    1: 60
    2: 300
    3: 3600
    4: 3600
  grace_seconds:
    1: 0
    2: 0
    3: 900
    4: 900
  jitter_pct: 20
  signing_key_id: maya-dev-key

# MAYA manages models and issues warrants. It does not execute models. A captive
# engine is bundled as a reference CONSUMER of the public warrant API, so that a
# deployment works out of the box; disable it and any external engine that
# resolves warrants behaves identically.
execution:
  captive:
    enabled: true
    max_seconds: 30

content:
  # Help and about pages are markdown files rendered at request time. They live
  # in the repository rather than the database so that a change to what the
  # platform says about itself is reviewable in the same pull request as the
  # change to what it does.
  dir: ./content

logging:
  level: INFO
  format: "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
