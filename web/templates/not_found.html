{% extends "base.html" %}
{% block title %}Not found — {{ app_name }}{% endblock %}
{% block content %}
<div class="accent"></div>
<h1 class="mt-3">No such model</h1>
<div class="rule"></div>
<p class="text-muted">Nothing is registered under
  <code class="mono">maya://model/{{ name }}</code>.</p>
<a href="/" class="btn btn-sm" style="background:var(--crimson);color:#fff">Back to the inventory</a>
{% endblock %}
