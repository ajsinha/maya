[project]
name = "maya"
description = "MAYA — Model & AI Lifecycle Assurance. Evidence, not assertion."
requires-python = ">=3.13"
dynamic = ["version", "dependencies"]
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
license = { file = "LICENSE" }

[project.scripts]
maya = "maya.cli.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "maya.core.version.VERSION" }
# The SDK is its own distribution (./sdk, maya-sdk); the server depends on it like any client
dependencies = { file = ["requirements.txt", "requirements-sdk.txt"] }

[tool.setuptools.packages.find]
include = ["maya*", "maya_delta*"]
exclude = ["maya.sdk*"]  # never bundled: the SDK ships only as maya-sdk

[tool.setuptools.package-data]
"maya.persistence" = ["schema/*.sql"]
"maya.workflow" = ["*.yaml"]
"maya.web" = ["templates/**/*", "static/**/*", "guides/*.md"]
"maya.documents" = ["templates/*.md.j2"]  # the built-in model card, report and documentation

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PLR0915"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50        # function length (plan gate 1)

[tool.coverage.run]
# the sandbox child runs in its own interpreter; its paths are proved by test_sandbox_linux
omit = ["maya/security/sandbox_runner.py"]

[tool.mypy]
# The typed layer (plan gate 2): `mypy --strict` on maya/services, run by gates.py.
python_version = "3.13"
strict = true
# `maya` is a namespace package (the SDK ships as its own distribution, maya-sdk), so mypy
# is told where package names start
explicit_package_bases = true
mypy_path = ".,sdk"  # the server, and the maya-sdk project beside it
ignore_missing_imports = true      # pyarrow, deltalake, onelogin, ... ship no stubs
follow_imports = "silent"          # check services; use, not re-report, what they import
# One relaxation, deliberately: repositories are looked up by name through the unit of
# work (uow.repo("features")), which is typed Any, so their rows reach callers as Any.
# Returning such a row from a function annotated dict[str, Any] is correct, and 100+
# casts to say so would add noise, not safety.
warn_return_any = false
