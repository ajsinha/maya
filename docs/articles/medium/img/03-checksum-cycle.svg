<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A51C30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6873"/></marker></defs><rect width="1400" height="680" fill="#FBF9F7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">The checksum cycle: what turns a warrant from paperwork into a control</text><rect x="100" y="90" width="260" height="54" rx="10" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="230" y="124" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Model developer</text><line x1="230" y1="150" x2="230" y2="640" stroke="#D9D3CB" stroke-width="2" stroke-dasharray="6 6"/><rect x="570" y="90" width="260" height="54" rx="10" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="700" y="124" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#A51C30" text-anchor="middle">MAYA</text><line x1="700" y1="150" x2="700" y2="640" stroke="#D9D3CB" stroke-width="2" stroke-dasharray="6 6"/><rect x="1040" y="90" width="260" height="54" rx="10" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="1170" y="124" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Their compute</text><line x1="1170" y1="150" x2="1170" y2="640" stroke="#D9D3CB" stroke-width="2" stroke-dasharray="6 6"/><line x1="230" y1="195" x2="692" y2="195" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="465.0" y="183" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">draw a training warrant (model@v3 + pin #q1)</text><line x1="700" y1="255" x2="238" y2="255" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="465.0" y="243" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">the data, and the checksum c it issued (c recorded)</text><line x1="230" y1="315" x2="1162" y2="315" stroke="#293352" stroke-width="2.5" marker-end="url(#a)"/><text x="935" y="303" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">train, wherever the developer trains</text><line x1="1170" y1="375" x2="238" y2="375" stroke="#293352" stroke-width="2.5" marker-end="url(#a)"/><text x="935" y="363" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">parameters</text><line x1="230" y1="435" x2="692" y2="435" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="465.0" y="423" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">upload the parameters, naming the checksum c</text><rect x="470" y="480" width="460" height="150" rx="10" fill="#fff" stroke="#A51C30" stroke-width="2"/><text x="700" y="515" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#A51C30" text-anchor="middle">c among the checksums MAYA issued?</text><text x="700" y="552" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E6B3A" text-anchor="middle">yes → verified, may be approved</text><text x="700" y="585" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#B42318" text-anchor="middle">no → flagged unverified_data:</text><text x="700" y="610" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6873" text-anchor="middle">approval needs a written override</text></svg>