<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A51C30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6873"/></marker></defs><rect width="1400" height="640" fill="#FBF9F7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">Beside the ML platform, not instead of it</text><rect x="560" y="230" width="280" height="190" rx="16" fill="#F8E6E9" stroke="#A51C30" stroke-width="3"/><text x="700" y="290" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#A51C30" text-anchor="middle">MAYA</text><text x="700" y="325" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="middle">the record, the licence</text><text x="700" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1A1A1A" text-anchor="middle">and the evidence</text><text x="700" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">trains nothing · serves nothing</text><rect x="60" y="110" width="300" height="90" rx="12" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="210" y="148" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">data sources</text><text x="210" y="174" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">files, SQL, producers</text><line x1="364" y1="155" x2="552" y2="278.3333333333333" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/><rect x="60" y="250" width="300" height="90" rx="12" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="210" y="288" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">feature pipelines</text><text x="210" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">two clocks, pinned</text><line x1="364" y1="295" x2="552" y2="325.0" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/><rect x="60" y="390" width="300" height="90" rx="12" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="210" y="428" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">model designers</text><text x="210" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a formula or a black box</text><line x1="364" y1="435" x2="552" y2="371.6666666666667" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/><rect x="1040" y="80" width="320" height="92" rx="12" fill="#fff" stroke="#293352" stroke-width="2"/><text x="1200" y="118" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#293352" text-anchor="middle">model registry (MLflow)</text><text x="1200" y="144" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">an alias that follows the licence</text><line x1="846" y1="262.6666666666667" x2="1032" y2="126" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="1040" y="205" width="320" height="92" rx="12" fill="#fff" stroke="#293352" stroke-width="2"/><text x="1200" y="243" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#293352" text-anchor="middle">training compute</text><text x="1200" y="269" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a signed job, a one-day key</text><line x1="846" y1="304.3333333333333" x2="1032" y2="251" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="1040" y="330" width="320" height="92" rx="12" fill="#fff" stroke="#293352" stroke-width="2"/><text x="1200" y="368" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#293352" text-anchor="middle">scoring service</text><text x="1200" y="394" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a guard checks, then reports</text><line x1="846" y1="346.0" x2="1032" y2="376" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="1040" y="455" width="320" height="92" rx="12" fill="#fff" stroke="#293352" stroke-width="2"/><text x="1200" y="493" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#293352" text-anchor="middle">batch scoring</text><text x="1200" y="519" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">sealed by hash, reported</text><line x1="846" y1="387.6666666666667" x2="1032" y2="501" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="460" y="520" width="480" height="90" rx="12" fill="#fff" stroke="#D9D3CB" stroke-width="2"/><text x="700" y="558" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">validators, auditors, supervisors</text><text x="700" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a bundle that verifies on a machine with no MAYA</text><line x1="700" y1="424" x2="700" y2="512" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/></svg>