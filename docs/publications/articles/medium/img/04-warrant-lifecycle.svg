<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A51C30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6873"/></marker></defs><rect width="1400" height="570" fill="#FBF9F7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">An execution warrant is a live instrument, not a document</text><rect x="50" y="168" width="180" height="64" rx="32" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="140" y="207" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#A51C30" text-anchor="middle">draft</text><rect x="290" y="168" width="180" height="64" rx="32" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="380" y="207" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#A51C30" text-anchor="middle">submitted</text><rect x="530" y="168" width="180" height="64" rx="32" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="620" y="207" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#A51C30" text-anchor="middle">approved</text><rect x="810" y="168" width="180" height="64" rx="32" fill="#E3F1E7" stroke="#1E6B3A" stroke-width="2"/><text x="900" y="207" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1E6B3A" text-anchor="middle">sealed · live</text><rect x="810" y="398" width="180" height="64" rx="32" fill="#FBE9E7" stroke="#B42318" stroke-width="2"/><text x="900" y="437" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#B42318" text-anchor="middle">suspended</text><rect x="1110" y="88" width="180" height="64" rx="32" fill="#F1EFEC" stroke="#5F6873" stroke-width="2"/><text x="1200" y="127" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#5F6873" text-anchor="middle">expired</text><rect x="1110" y="258" width="180" height="64" rx="32" fill="#F1EFEC" stroke="#5F6873" stroke-width="2"/><text x="1200" y="297" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#5F6873" text-anchor="middle">revoked</text><line x1="232" y1="200" x2="288" y2="200" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="260" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6873" text-anchor="middle">submit</text><line x1="472" y1="200" x2="528" y2="200" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6873" text-anchor="middle">approve</text><line x1="712" y1="200" x2="808" y2="200" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><text x="760" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6873" text-anchor="middle">seal</text><line x1="880" y1="234" x2="880" y2="396" stroke="#B42318" stroke-width="2.5" marker-end="url(#a)"/><text x="700" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#B42318" text-anchor="middle">a covenant breach, or</text><text x="700" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#B42318" text-anchor="middle">an overdue periodic review</text><line x1="920" y1="396" x2="920" y2="234" stroke="#1E6B3A" stroke-width="2.5" marker-end="url(#a)"/><text x="940" y="352" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E6B3A" text-anchor="start">reinstated, with a reason</text><line x1="992" y1="190" x2="1108" y2="130" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/><text x="1030" y="128" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6873" text-anchor="end">validity ends</text><line x1="992" y1="214" x2="1108" y2="280" stroke="#5F6873" stroke-width="2.5" marker-end="url(#g)"/><text x="1030" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6873" text-anchor="middle">revoked</text><text x="700" y="530" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5F6873" text-anchor="middle">every call against a warrant that is not live fails closed, naming the person to contact</text></svg>