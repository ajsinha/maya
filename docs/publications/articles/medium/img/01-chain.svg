<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A51C30"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6873"/></marker></defs><rect width="1400" height="400" fill="#FBF9F7"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">The chain MAYA keeps behind every number</text><rect x="50" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="140.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">data</text><text x="140.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">as it arrived</text><text x="140.0" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a CSV, a SQL pull</text><line x1="234" y1="175" x2="266" y2="175" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="272" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="362.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">feature</text><text x="362.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">as it stood then</text><text x="362.0" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">two clocks per value</text><line x1="456" y1="175" x2="488" y2="175" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="494" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="584.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">pin</text><text x="584.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">readable for ever</text><text x="584.0" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">named by its hash</text><line x1="678" y1="175" x2="710" y2="175" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="716" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="806.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">model</text><text x="806.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">MAYA evaluates it</text><text x="806.0" y="262" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">ŷ = a·x + b</text><line x1="900" y1="175" x2="932" y2="175" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="938" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="1028.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">warrant</text><text x="1028.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">or it does not run</text><text x="1028.0" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">a licence, refusable</text><line x1="1122" y1="175" x2="1154" y2="175" stroke="#A51C30" stroke-width="2.5" marker-end="url(#a)"/><rect x="1160" y="120" width="180" height="110" rx="12" fill="#F8E6E9" stroke="#A51C30" stroke-width="2"/><text x="1250.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A51C30" text-anchor="middle">run</text><text x="1250.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="middle">reported, checked</text><text x="1250.0" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6873" text-anchor="middle">covenants on every run</text><rect x="300" y="310" width="800" height="56" rx="10" fill="#F4EFE8" stroke="#D9D3CB" stroke-width="1.5"/><text x="700" y="345" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#5F6873" text-anchor="middle">every link sealed by a content hash:  sha256 9f3a 61c0 … 7b2d e21c</text></svg>